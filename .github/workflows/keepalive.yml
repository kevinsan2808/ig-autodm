# Pings the bot every 10 minutes so Render's free plan doesn't put it to sleep
# (a sleeping server can miss Instagram comments).
name: Keep AutoDM awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://ig-autodm.onrender.com/health || true
